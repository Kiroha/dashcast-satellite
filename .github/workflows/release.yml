name: Signed satellite build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: satellite-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/verify_protocol.py
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease
      - name: Import dedicated satellite signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SATELLITE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satellite.jks"
      - name: Assemble signed release
        env:
          SATELLITE_KEYSTORE: ${{ runner.temp }}/satellite.jks
          SATELLITE_STORE_PASSWORD: ${{ secrets.SATELLITE_STORE_PASSWORD }}
          SATELLITE_KEY_ALIAS: ${{ secrets.SATELLITE_KEY_ALIAS }}
          SATELLITE_KEY_PASSWORD: ${{ secrets.SATELLITE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dashcast-satellite-release
          path: app/build/outputs/apk/release/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/satellite.jks"
