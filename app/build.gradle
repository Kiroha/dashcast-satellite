plugins { id 'com.android.application' }

def signingVariables = ['SATELLITE_KEYSTORE', 'SATELLITE_STORE_PASSWORD',
                        'SATELLITE_KEY_ALIAS', 'SATELLITE_KEY_PASSWORD']
def hasReleaseKey = signingVariables.every { System.getenv(it) }

android {
    namespace = 'io.github.kiroha.dashcast.satellite'
    compileSdk = 36
    defaultConfig {
        applicationId = 'io.github.kiroha.dashcast.satellite'
        minSdk = 26
        targetSdk = 36
        versionCode = 14
        versionName = '0.9.4'
    }
    signingConfigs {
        if (hasReleaseKey) {
            satelliteRelease {
                storeFile = file(System.getenv('SATELLITE_KEYSTORE'))
                storePassword = System.getenv('SATELLITE_STORE_PASSWORD')
                keyAlias = System.getenv('SATELLITE_KEY_ALIAS')
                keyPassword = System.getenv('SATELLITE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix = '.debug'; versionNameSuffix = '-dev' }
        release {
            if (hasReleaseKey) signingConfig = signingConfigs.satelliteRelease
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets { test.resources.srcDir '../protocol' }
    lint {
        abortOnError = true
        warningsAsErrors = true
        // Build versions are pinned and reviewed together; availability is not a correctness check.
        disable 'AndroidGradlePluginVersion'
    }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

tasks.register('requireSatelliteReleaseKey') {
    doLast {
        if (!hasReleaseKey) throw new GradleException(
            'Release requires the four SATELLITE_* signing variables and a dedicated application key.')
    }
}
tasks.configureEach {
    if (name == 'packageRelease' || name == 'signReleaseBundle') {
        dependsOn 'requireSatelliteReleaseKey'
    }
}

dependencies {
    // Narrow read-only APK sharing with the Android package installer.
    implementation 'androidx.core:core:1.17.0'
    // Vetted password-authenticated exchange permits a six-digit code without offline guessing.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    // Maintained native sender; receiver uses its installed WebView instead.
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    // Do not send library diagnostics to a log backend: frame payloads are private.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.16.1') {
        // Run pairing tests against the same pinned lightweight crypto implementation as the APK.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
}

// Refuse a changed native binary under the reviewed coordinate in local builds and CI.
tasks.register('verifyWebRtcArchive') {
    doLast {
        def artifact = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'io.github.webrtc-sdk' && it.name == 'android'
        }
        if (artifact == null || artifact.moduleVersion.id.version != '150.7871.01') {
            throw new GradleException('Reviewed native WebRTC archive unavailable.')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.file.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != '0a1627b1a48c2bc17d9a40d62fc47bd45166f44a311e95917f147c402de379b0') {
            throw new GradleException('Native WebRTC archive differs from the reviewed SHA-256.')
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyWebRtcArchive' }
